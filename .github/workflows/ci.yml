name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - name: Syntax check
        run: backend/.venv/bin/python -m py_compile backend/app.py backend/wsgi.py tests/test_backend_api.py
      - name: Unit tests
        run: backend/.venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Smoke script syntax
        run: backend/.venv/bin/python -m py_compile scripts/smoke_test.py
      - name: Repo hygiene
        run: |
          test -z "$(git ls-files '*.env' '*.db' | grep -v '^frontend/package-lock.json' || true)"
          ! grep -RIn "change-me" . --exclude-dir=.git --exclude-dir=backend/.venv --exclude=*.md --exclude=.env.example --exclude=frontend/.env.example

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: CI=true npm test -- --runInBand
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key
      CORS_ORIGINS: http://localhost:5000
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      DEMO_RESET_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config
      - name: Compose build
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Smoke test
        run: BASE_URL=http://127.0.0.1:5000 python3 scripts/smoke_test.py
      - name: Tear down
        if: always()
        run: docker compose down -v
