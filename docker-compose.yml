services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gluverse}
      POSTGRES_USER: ${POSTGRES_USER:-gluverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: unless-stopped
    volumes:
      - gluverse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      args:
        REACT_APP_API_BASE_URL: ""
    environment:
      APP_ENV: production
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gluverse}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-gluverse}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY must be set}
      NVIDIA_API_BASE_URL: ${NVIDIA_API_BASE_URL:-https://integrate.api.nvidia.com/v1/chat/completions}
      NVIDIA_COACH_MODEL: ${NVIDIA_COACH_MODEL:?NVIDIA_COACH_MODEL must be set}
      NVIDIA_SAFETY_MODEL: ${NVIDIA_SAFETY_MODEL:?NVIDIA_SAFETY_MODEL must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: ${PORT:-5000}
      TOKEN_TTL_MINUTES: ${TOKEN_TTL_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      DEMO_RESET_ENABLED: ${DEMO_RESET_ENABLED:-false}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
    ports:
      - "${HOST_PORT:-5000}:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/ready', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  gluverse-postgres-data:
